name: Compilar APK de Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias de Node
        run: npm install

      - name: Preparar directorio web e Inicializar Capacitor
        run: |
          mkdir -p www
          cp -r $(ls -A | grep -vE '^\.git|node_modules|www|android') www/
          npx cap init "Mi App" "com.miempresa.app" --web-dir "www"

      - name: Agregar plataforma Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
